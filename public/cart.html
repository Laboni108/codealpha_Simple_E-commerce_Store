<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Your Cart — ShopEasy</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="/index.html">ShopEasy</a>
    <nav class="nav-links" id="nav-right"></nav>
  </div>
</header>

<main>
  <h1>Your Cart</h1>
  <div id="alert-area"></div>
  <div id="cart-container">
    <p class="empty-state">Loading cart…</p>
  </div>
</main>

<footer class="site-footer">Built with Express.js &amp; vanilla JS — a CodeAlpha e-commerce demo.</footer>

<script src="/js/main.js"></script>
<script>
  async function loadCart() {
    const container = document.getElementById('cart-container');
    try {
      const { items, total } = await api.get('/api/cart');

      if (items.length === 0) {
        container.innerHTML = '<p class="empty-state">Your cart is empty. <a href="/index.html">Browse products</a>.</p>';
        return;
      }

      container.innerHTML = `
        <table class="cart-table">
          <thead>
            <tr><th>Product</th><th>Price</th><th>Qty</th><th>Subtotal</th><th></th></tr>
          </thead>
          <tbody>
            ${items.map((i) => `
              <tr data-id="${i.productId}">
                <td class="cart-item-name"><img src="${i.image}" alt="${escapeHtml(i.name)}" /> ${escapeHtml(i.name)}</td>
                <td>${formatMoney(i.price)}</td>
                <td><input type="number" class="cart-qty-input" value="${i.qty}" min="1" max="${i.stock}" data-id="${i.productId}" /></td>
                <td>${formatMoney(i.subtotal)}</td>
                <td><button class="btn btn-danger btn-sm remove-btn" data-id="${i.productId}">Remove</button></td>
              </tr>
            `).join('')}
          </tbody>
        </table>
        <div class="cart-summary">
          <div class="cart-summary-box">
            <div class="total-row"><span>Total</span><span>${formatMoney(total)}</span></div>
            <a href="/checkout.html" class="btn" style="display:block;text-align:center;">Proceed to Checkout</a>
          </div>
        </div>
      `;

      document.querySelectorAll('.cart-qty-input').forEach((input) => {
        input.addEventListener('change', async () => {
          const id = input.dataset.id;
          try {
            await api.put(`/api/cart/${id}`, { qty: Number(input.value) });
            await Promise.all([loadCart(), renderNav()]);
          } catch (err) {
            showAlert(err.message);
            loadCart();
          }
        });
      });

      document.querySelectorAll('.remove-btn').forEach((btn) => {
        btn.addEventListener('click', async () => {
          await api.del(`/api/cart/${btn.dataset.id}`);
          await Promise.all([loadCart(), renderNav()]);
        });
      });
    } catch (err) {
      container.innerHTML = `<p class="empty-state">${escapeHtml(err.message)}</p>`;
    }
  }

  function showAlert(msg) {
    document.getElementById('alert-area').innerHTML = `<div class="alert alert-error">${escapeHtml(msg)}</div>`;
  }

  loadCart();
</script>
</body>
</html>
