<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Checkout — ShopEasy</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="logo" href="/index.html">ShopEasy</a>
    <nav class="nav-links" id="nav-right"></nav>
  </div>
</header>

<main>
  <h1>Checkout</h1>
  <div id="checkout-container">
    <p class="empty-state">Loading…</p>
  </div>
</main>

<footer class="site-footer">Built with Express.js &amp; vanilla JS — a CodeAlpha e-commerce demo.</footer>

<script src="/js/main.js"></script>
<script>
  async function init() {
    const container = document.getElementById('checkout-container');
    const { user } = await api.get('/api/auth/me');

    if (!user) {
      container.innerHTML = `
        <p class="empty-state">
          Please <a href="/login.html?next=/checkout.html">log in</a> to complete checkout.
        </p>`;
      return;
    }

    const { items, total } = await api.get('/api/cart');
    if (items.length === 0) {
      container.innerHTML = '<p class="empty-state">Your cart is empty. <a href="/index.html">Browse products</a>.</p>';
      return;
    }

    container.innerHTML = `
      <div class="product-detail">
        <div>
          <h2>Order Summary</h2>
          <ul class="order-items-list">
            ${items.map((i) => `<li>${i.qty} × ${escapeHtml(i.name)} — ${formatMoney(i.subtotal)}</li>`).join('')}
          </ul>
          <p style="font-weight:700; margin-top:12px;">Total: ${formatMoney(total)}</p>
        </div>
        <div>
          <h2>Shipping Details</h2>
          <div id="alert-area"></div>
          <form id="checkout-form">
            <div class="form-group">
              <label for="address">Shipping address</label>
              <textarea id="address" rows="4" placeholder="Street, city, state, ZIP" required></textarea>
            </div>
            <button type="submit" class="btn">Place Order</button>
          </form>
        </div>
      </div>
    `;

    document.getElementById('checkout-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const alertArea = document.getElementById('alert-area');
      const shippingAddress = document.getElementById('address').value.trim();
      try {
        const { order } = await api.post('/api/orders', { shippingAddress });
        window.location.href = `/orders.html?placed=${order.id}`;
      } catch (err) {
        alertArea.innerHTML = `<div class="alert alert-error">${escapeHtml(err.message)}</div>`;
      }
    });
  }

  init();
</script>
</body>
</html>
